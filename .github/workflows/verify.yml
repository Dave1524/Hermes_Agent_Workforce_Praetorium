name: verify

# This repo's own gate (bin/verify.sh), run on the one surface that is not Praetorium.
#
# Nothing here may reach outward: no secrets, no Notion token, no relay, no vault. Every
# suite that needs box state skips via tests/box_precondition.sh, and the skip set is
# pinned in tests/ci-expected-skips.txt — a gate that silently shrinks off the box would
# be worse than no gate, because it reports green for a smaller claim than it appears to.
#
# Deliberately NOT wired to `push`. agent-workforce-auto-sync.timer commits and pushes main
# every 15 minutes whenever the tree is dirty, so a push trigger would bill a run per
# housekeeping commit and train everyone to ignore the result. PRs only.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Tool versions
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          bash --version | head -1
          shellcheck --version | sed -n '2p'
          python3 --version

      # The Control Room SPA (T5.3e): tests/test_control_room_spa.sh runs its toolchain half
      # — typecheck, vitest, and a rebuild that must be byte-identical to the committed
      # bin/control_room_ui/app/ — wherever node >= 22 and node_modules exist, and prints a
      # SKIP: line otherwise. Installing both here is what keeps that line OUT of
      # tests/ci-expected-skips.txt: CI proves the committed build, not just its stamp.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/control-room/package-lock.json

      - name: npm ci (ui/control-room)
        shell: bash
        run: npm ci --prefix ui/control-room

      - name: bash bin/verify.sh
        shell: bash
        run: bash bin/verify.sh 2>&1 | tee gate.log

      # Runs even on a red gate: skip drift is its own finding, and hiding it behind an
      # unrelated failure is how the set would rot unnoticed.
      - name: The skip set must be exactly what the repo declares
        if: always()
        shell: bash
        run: |
          grep '^SKIP: ' gate.log | LC_ALL=C sort -u > actual-skips.txt || true
          grep -vE '^[[:space:]]*(#|$)' tests/ci-expected-skips.txt \
            | LC_ALL=C sort -u > expected-skips.txt
          if ! diff -u expected-skips.txt actual-skips.txt; then
            echo "::error::the gate's skip set changed — a suite started or stopped skipping. Update tests/ci-expected-skips.txt in the same commit as the cause."
            exit 1
          fi
          echo "skip set matches ($(wc -l < expected-skips.txt) declared)"
