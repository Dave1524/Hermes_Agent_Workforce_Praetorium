# B5 (2026-10-09): the screen gets a writable root for the agent board ledger (bin/board.py),
# on the proposals drop-in's pattern, because control-room.service runs ProtectHome=read-only
# and must keep doing so. systemd creates the directory owned by dave, which is also the
# runners' and the Buzz sessions' user, so every ledger writer shares one root.
# Land: sudo cp systemd/control-room.service.d/board.conf /etc/systemd/system/control-room.service.d/
#   && sudo systemctl daemon-reload && sudo systemctl restart control-room.service   (the screen; no workflow timer)
[Service]
StateDirectory=control-room-board
Environment=CONTROL_ROOM_BOARD_ROOT=/var/lib/control-room-board
