# Does augustus still fire linkedin-review for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: linkedin-review-fires
runs: 3
execution:
  prompt: |
    Monthly LinkedIn review please — the new 28-day export is in the LinkedIn_Posts folder.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-linkedin-review
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?linkedin-review"'
    weight: 1
