# Does augustus still fire linkedin-content-engine for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: linkedin-content-engine-fires
runs: 3
execution:
  prompt: |
    Draft a LinkedIn post about why WMS implementations slip past their go-live date.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-linkedin-content-engine
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?linkedin-content-engine"'
    weight: 1
