# Does augustus still fire blog-engine for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: blog-engine-fires
runs: 3
execution:
  prompt: |
    Write a blog post about temperature excursions in Dutch cold-chain distribution centres.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-blog-engine
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blog-engine"'
    weight: 1
