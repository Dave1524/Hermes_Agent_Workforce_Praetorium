# Does claudius still fire prospect-research for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: prospect-research-fires
runs: 3
execution:
  prompt: |
    Research Kestrel Cold Logistics and write the outreach message.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-prospect-research
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?prospect-research"'
    weight: 1
