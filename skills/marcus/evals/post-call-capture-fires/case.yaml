# Does marcus still fire post-call-capture for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: post-call-capture-fires
runs: 3
execution:
  prompt: |
    Post-call Kestrel Cold Logistics: they want a pilot in Q4 and the ops director decides.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-post-call-capture
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?post-call-capture"'
    weight: 1
