# Does marcus still fire agent-inbox-sync for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: agent-inbox-sync-fires
runs: 3
execution:
  prompt: |
    Sync the agent inbox.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-agent-inbox-sync
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-inbox-sync"'
    weight: 1
