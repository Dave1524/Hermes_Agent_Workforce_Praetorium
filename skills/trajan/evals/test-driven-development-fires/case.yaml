# Does trajan still fire test-driven-development for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: test-driven-development-fires
runs: 3
execution:
  prompt: |
    Implement a retry wrapper around the HTTP client.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-test-driven-development
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-driven-development"'
    weight: 1
