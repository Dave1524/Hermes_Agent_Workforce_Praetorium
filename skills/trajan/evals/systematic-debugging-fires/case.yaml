# Does trajan still fire systematic-debugging for the phrase the vault's description says triggers it?
# The shape and the measured cost of a case are documented once, on
# claudius/evals/meeting-prep-fires/case.yaml; skills/README.md says how to add one.
schema_version: "1.1"
name: systematic-debugging-fires
runs: 3
execution:
  prompt: |
    The test suite fails about one run in seven and I cannot work out why.
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-systematic-debugging
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?systematic-debugging"'
    weight: 1
