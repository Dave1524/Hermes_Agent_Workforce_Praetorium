# augustus — editor-in-chief. Normative capability manifest (D2).
# Descriptive of live state 2026-09-01. Ownership from design/workflow-registry.md §2/§4.
#
# augustus is the exception on every axis: the only codex-acp agent, the only one whose
# namespace is narrowed by bwrap, and the only one who owns a workflow that runs by
# DISPATCHING TO HIMSELF over Buzz rather than by invoking a model directly.

name    = "augustus"
role    = "Editor-in-chief — content pipeline, pitches and drafts"
pubkey  = "d36e4b8b8c8c3c6424c884110c22fcbbed6fc2d55374f4576ee51d43145c7d01"
harness = "codex-acp"
status  = "live"

[surfaces.interactive]
present     = true
governed_by = "buzz-team/augustus.toml"      # SOURCE. Deployed to ~/.config/buzz-team/augustus.toml by bin/deploy_buzz_team.sh; the box path is the destination (brief 7)
admits      = ["owner", "praetorium", "marcus"]
channels    = "all"
tools       = ["codex-builtins", "mcp__qmd-mcp__*", "notion_* (7, via broker)"]
mcp         = ["qmd-mcp", "buzz-team-mcp"]
notes       = """
His bwrap wrapper --tmpfs's ~/.ssh and ~/.config/agent-workforce, so he can never
git fetch and never read a job credential. That is deliberate containment, and it is why
the Notion path goes through buzz-notion-broker.py on the host namespace rather than
through the bridge's own credential — see ~/CLAUDE.md, "The fleet MCP bridge".
Consequence for ownership: augustus must never own a workflow that needs git fetch.
Codex permission profiles do NOT reach an ACP session, so the deny-list that governs the
other four does not govern him at all — his boundary is the namespace plus his charter.
"""

[surfaces.scheduled]
present     = true
governed_by = "bin/run_standing_research_topic_cc.sh"
tools       = ["Bash", "Read", "Write", "Glob", "Grep", "WebSearch", "WebFetch"]
mcp         = []
notes       = """
No Edit. AGENT_RUN_MODE=ops and no delivery step, by design — these two write their
output and stop. The executor here is headless Claude Code on Opus 5, not codex; augustus
is the accountable owner, not the runtime (registry §7.3).
"""

[surfaces.kanban]
present     = false
retired     = "2026-09-02"       # D7. Block kept, not deleted — see agent-model.md §3.
governed_by = "~/.hermes/profiles/augustus/config.yaml"
skills      = 23                 # vault-business 16 + plugin-shared 7
notes       = "Narrowest offering of the four. No plugin-official, no anthropic-generic. Augustus's live work moved to S4 (buzz_dispatch) long before the board was retired; he authored 4 of its 11 cards, all `done`, all before 2026-07-20."

# The fourth surface exists for exactly one workflow.
[surfaces.buzz_dispatch]
present     = true
governed_by = "bin/run_content_via_buzz.sh + bin/buzz_routes.env"
tools       = "inherits surfaces.interactive entirely"
notes       = """
A timer triggers augustus over the content route and waits. Three-state exit contract,
quoted from the script header:
  4 (CRASH_EXIT)  the trigger never landed — nobody was asked
  1               augustus was asked and produced nothing within the wait
  0               the board moved, or augustus replied DECLINE:
The distinction between 4 and 1 is the whole point: "nobody was asked" and "asked and
declined" are different failures and were once the same exit code.
bin/deliver.sh is the ONLY script permitted to call buzz messages send.
"""

[[workflows]]
unit     = "augustus-content"
surface  = "buzz_dispatch"
trigger  = "daily 01:30 (RandomizedDelaySec=5min, Persistent=true)"
model    = "n/a — dispatches to the live augustus session"
runner   = "bin/agent_propose.sh -> bin/run_content_via_buzz.sh"
route    = "content"
contract = "design/contracts/augustus-content.md"          # TODO Phase B
status   = "standing"
suite    = ["tests/test_run_content_via_buzz.sh", "tests/test_content_skill_extract.sh"]
notes    = """
Shares AGENT_JOB_OVERRIDES and DELIVERY_TASK with content-change-dispatch below: they are
two triggers on ONE workflow, not two workflows. Collides at 01:30 with
praetorium-faceless-content-research over the global propose lock — agent-model.md §6.6.
"""

[[workflows]]
unit     = "content-change-dispatch"
surface  = "buzz_dispatch"
trigger  = "every 15 min"
runner   = "bin/content_change_dispatch.sh"
route    = "content"
contract = "design/contracts/augustus-content.md"          # same contract, change-triggered
status   = "standing"
suite    = ["tests/test_content_change_dispatch.sh",
           "tests/test_content_dispatch_state_hold.sh"]
notes    = "Polls Notion Picked rows; drafts only on a new row. Re-enabled 2026-09-01 (registry §7.4)."

[[workflows]]
unit     = "praetorium-content-strategy-research"
surface  = "scheduled"
trigger  = "EXPIRES 2026-09-03 23:00 — four absolute OnCalendar dates, not a recurring calendar"
model    = "claude-opus-5"
profile  = "profiles/standing_research_content_strategy_task.md"
runner   = "bin/run_standing_research_topic_cc.sh"
run_mode = "ops"
contract = "design/contracts/content-strategy-research.md" # TODO Phase B
status   = "campaign"
suite    = []
expires  = "2026-09-03 23:00"
notes    = "agent-model.md §6.5. Also has no source in systemd/ — §6.7."

[[workflows]]
unit     = "praetorium-faceless-content-research"
surface  = "scheduled"
trigger  = "EXPIRES 2026-09-04 01:30 — four absolute OnCalendar dates, not a recurring calendar"
model    = "claude-opus-5"
profile  = "profiles/standing_research_faceless_content_task.md"
runner   = "bin/run_standing_research_topic_cc.sh"
run_mode = "ops"
contract = "design/contracts/faceless-content-research.md" # TODO Phase B
status   = "campaign"
suite    = []
expires  = "2026-09-04 01:30"
notes    = "agent-model.md §6.5 and §6.7. Logged one silent lock-skip on 2026-08-31 (§6.6)."


# --- S1, brief 7. See marcus.toml for why these five entries exist and what `kind` does.
[[workflows]]
unit     = "buzz-agent@augustus"
surface  = "interactive"
scope    = "user"
kind     = "service"
trigger  = "event-driven — a Buzz mention or DM; no OnCalendar, the unit is always on"
model    = "from the run log, not the deny-listed env"
profile  = "~/.config/buzz-agents/augustus.prompt (deny-listed; no repo source)"
profile_in_repo = false          # deny-listed box path, not a repo file — see notes
runner   = "buzz-team/buzz-acp-launch.sh"
contract = "design/contracts/buzz-interactive.md"   # ONE contract, five owners — it says why in its header
status   = "standing"
suite    = ["tests/test_buzz_interactive_harness.sh"]
in_repo  = true
notes    = """
The harness exception, and it matters for what this entry may be credited with. A drop-in
swaps his ExecStart to codex-acp, so CLAUDE_CODE_EXECUTABLE and buzz-team/agent-settings.json
are INERT for him — his connector absence is a property of his namespace, asserted separately
by tests/test_fleet_guards.sh::augustus-no-claude-connectors. Do not credit the wrapper for
him. buzz-team/augustus.toml still governs his dispatch: the rules file is read by buzz-acp,
which is upstream of the harness swap.
"""

# Capability prohibitions. enforced = true means a mechanism blocks it today;
# enforced = false means it is stated policy that nothing currently prevents.

[[must_not]]
rule     = "send email or any outward message"
enforced = true
why      = "he runs codex-acp, so the claude.ai connector surface is absent from his harness by construction. NOT the strict settings file — that reaches claude-agent-acp sessions only, and crediting it here would be the §2/§6.1 defect D3 found"
test     = "tests/test_fleet_guards.sh::augustus-no-claude-connectors"

[[must_not]]
rule     = "own any workflow requiring git fetch"
enforced = true
why      = "bwrap --tmpfs ~/.ssh strips the capability — his namespace has neither the deploy keys nor the Host aliases"
test     = "tests/test_fleet_guards.sh::augustus-no-fetch"

[[must_not]]
rule     = "call buzz messages send outside bin/deliver.sh"
enforced = false
why      = "single-publisher rule; prose in run_content_via_buzz.sh"

[[must_not]]
rule     = "read Tier-A vault context on an unpinned provider"
enforced = false
why      = "open gap — no ZDR provider pin on his hermes config; irrelevant on the CC surfaces"
