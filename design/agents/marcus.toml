# marcus — chief of staff. Normative capability manifest (D2).
# Descriptive of live state 2026-09-01; normative once design/agent-model.md §7 is wired.
# Ownership comes from design/workflow-registry.md §2 (frozen D1). Do not re-decide it here.

name    = "marcus"
role    = "Chief of staff — dispatch, Dave's daily rhythm, fleet reporting"
pubkey  = "abbc19ddcc22f6511183936a4993359d4d22c6ef5afc53c7dba65bdeb958916b"
harness = "claude-agent-acp"
status  = "live"

# marcus is the DAG root: ~20 channels, and the only agent whose dispatch rules admit
# nobody but Dave and praetorium. That is what keeps the fleet from looping, and it is
# also why he alone hits the context ceiling (memory: marcus-context-overflow).
[surfaces.interactive]
present     = true
governed_by = "buzz-team/marcus.toml"      # SOURCE. Deployed to ~/.config/buzz-team/marcus.toml by bin/deploy_buzz_team.sh; the box path is the destination (brief 7)
admits      = ["owner", "praetorium"]
channels    = "all"
tools       = ["claude-code-builtins", "mcp__qmd-mcp__*", "notion_* (7, via broker)"]
mcp         = ["qmd-mcp", "buzz-team-mcp"]
notes       = """
The claude.ai connectors (Gmail, M365, Drive, Figma) are denied on this surface as of
2026-09-01 — CLAUDE_CODE_EXECUTABLE points buzz-agent@.service at
~/.config/buzz-team/claude-agent-wrapper.sh, which adds --settings
~/.config/buzz-team/agent-settings.json. Dave's own interactive sessions keep them.
Mechanism and proof: agent-model.md §6.1.
"""

[surfaces.scheduled]
present     = true
governed_by = "bin/run_daily_rhythm_cc.sh, bin/run_overnight_morning_report_cc.sh, bin/run_weekly_pre_assembly_cc.sh"
tools       = ["Bash", "Read", "Write", "Glob", "Grep"]
mcp         = []                 # --strict-mcp-config --mcp-config '{"mcpServers":{}}'
notes       = """
Identical allowlist on all four of his workflows — no Edit, no WebSearch, no WebFetch.
The daily-rhythm and weekly jobs run bin/vault_sync_guard.sh check as a pre-flight;
overnight-morning-report deliberately does not (it reads systemd and journals, not the
vault) and additionally sets umask 077.
"""

[surfaces.kanban]
present     = false
retired     = "2026-09-02"       # D7. Block kept, not deleted — see agent-model.md §3.
governed_by = "~/.hermes/profiles/marcus/config.yaml"
skills      = 46                 # plugin-shared 7 + vault-business 16 + plugin-official 23
notes       = "Widest skill offering on the box, on the surface that carried the least work — and in the end none: 0 of the board's 11 cards ever set `skills`. The count outlives the surface because it measures the hermes PROFILE, which `hermes -p marcus` oneshots still use."

[surfaces.buzz_dispatch]
