# aurelian — cold verification. Normative capability manifest (D2).
# Descriptive of live state 2026-09-01.
#
# aurelian is the only persona on this box that EXECUTES NOTHING. That is not an oversight
# and not a degraded state — it is the calibration pin. Every other agent's output can be
# checked by an agent that has no stake in it and cannot have produced it. The moment he
# acquires a workflow THAT RUNS, he stops being able to do his job.
#
# The qualifier is load-bearing and was added 2026-09-03 with the one [[workflows]] entry
# below. This header used to say "OWNS NOTHING" and "the moment he acquires a workflow",
# unqualified, which the same commit that adds an S1 presence entry would have falsified —
# and a true-looking sentence whose premise has just been removed is worse than no sentence.
# The distinction that survives: he owns a SURFACE PRESENCE (a live unit the registry must be
# able to see), and no unit of WORK. Nothing schedules him, nothing routes to him, and
# bin/buzz_agents.env still cannot resolve his slug.

name    = "aurelian"
role    = "Cold verification — independent check on other agents' claims; never a co-author"
pubkey  = ""                     # deliberately not recorded here — see notes
harness = "claude-agent-acp"
status  = "read-only"

[surfaces.interactive]
present     = true
governed_by = "buzz-team/aurelian.toml"      # SOURCE. Deployed to ~/.config/buzz-team/aurelian.toml by bin/deploy_buzz_team.sh; the box path is the destination (brief 7)
admits      = ["owner", "praetorium", "marcus", "claudius", "augustus", "trajan"]
channels    = "all"
tools       = ["claude-code-builtins (read paths)", "mcp__qmd-mcp__*"]
mcp         = ["qmd-mcp", "buzz-team-mcp"]
notes       = """
He is a ONE-WAY SINK: his rules admit all five other identities plus Dave, and none of
theirs admit him, so a verdict he publishes is accepted by the relay and dropped at every
worker's dispatch. Only Dave reads it. That asymmetry is the design — a verifier who can
steer the verified is no longer independent.

His pubkey is absent from bin/buzz_agents.env, which is correct and load-bearing: that
file is the slug->key table a scheduled delivery resolves, so an identity missing from it
CANNOT be addressed by any timer. Leaving it blank here is how the manifest says "no
scheduled job may wake this agent". It is not a TODO. His key is public and readable from
the relay if ever needed; the point is that nothing on the delivery path can look it up.
"""

[surfaces.scheduled]
present = false
notes   = "By calibration pin. A scheduled aurelian would be a co-author of the state he checks."

[surfaces.kanban]
present = false
retired = "2026-09-02"           # D7. Was already `false`; the surface it was false ABOUT is now gone too.
notes   = "No ~/.hermes/profiles/aurelian — the on-disk profiles are marcus, claudius, augustus, trajan, base0, leantest, default. That list still holds after the retirement: D7 retired the board and the gateway, not the hermes profiles."

[surfaces.buzz_dispatch]
present = false

# --- S1, brief 7. ONE entry, and it is a PRESENCE entry, not a job.
#
# This block used to read "No [[workflows]]. Intentionally. Do not add one without retiring
# the pin first." That sentence was written about EXECUTING work and it stays true about
# executing work: aurelian owns no scheduled workflow, no platform job, no route, and
# acquiring one would end the calibration pin. What changed is that the registry now has to
# be able to SEE a live unit. buzz-agent@aurelian.service is `active running` on this box and
# was declared nowhere, which is the same class of gap as the nine --user units brief 2 found
# — a live thing with no owner is invisible to every check that walks the declared set.
#
# So: `surface = "interactive"`, `kind = "service"`, and nothing that executes. Read the
# distinction before adding a second entry here; if the next one has a `route`, a `runner`
# that is not the shared launcher, or an OnCalendar, the pin is being retired and that is a
# decision, not a manifest edit.
[[workflows]]
unit     = "buzz-agent@aurelian"
surface  = "interactive"
scope    = "user"
kind     = "service"
trigger  = "event-driven — a Buzz mention from Dave or from a worker submitting its own output"
model    = "from the run log, not the deny-listed env"
profile  = "~/.config/buzz-agents/aurelian.prompt + ~/.config/buzz-team/aurelian-calibration.md (both deny-listed or declared excluded; no repo source)"
profile_in_repo = false          # deny-listed box path, not a repo file — see notes
runner   = "buzz-team/buzz-acp-launch.sh"
contract = "design/contracts/buzz-interactive.md"   # ONE contract, five owners — it says why in its header
status   = "standing"
suite    = ["tests/test_buzz_interactive_harness.sh"]
in_repo  = true
notes    = """
The suite that owns this entry is the one that asserts the asymmetry he depends on: he
admits all five other identities and none of theirs admits him, so a verdict he publishes is
accepted by the relay and dropped at every worker's dispatch. A symmetric edge would end the
one-way property silently, in one line of one file, and that is what
tests/test_buzz_interactive_harness.sh watches.

His isolation knobs (BUZZ_ACP_CONTEXT_MESSAGE_LIMIT=0, NO_MEMORY, MAX_TURNS_PER_SESSION=1,
HEARTBEAT_INTERVAL=0) are asserted from /proc by buzz-team/verify-fleet.sh, not from a unit
file — a drop-in that was never loaded looks identical to one that was, and the heartbeat
value cannot be set in a unit file at all because EnvironmentFile= overrides Environment=.
That gate is machine-level and stays machine-level; see docs/runbook.md § S1.
"""


# Capability prohibitions. enforced = true means a mechanism blocks it today;
# enforced = false means it is stated policy that nothing currently prevents.

[[must_not]]
rule     = "execute anything — no writes, no commits, no sends"
enforced = false
why      = "the pin is unattestable by construction; it is charter prose, and an INCONCLUSIVE verdict is correct behaviour rather than a fault"

[[must_not]]
rule     = "co-author or edit an artifact he later verifies"
enforced = false
why      = "independence is the only thing he provides"

[[must_not]]
rule     = "appear in bin/buzz_agents.env"
enforced = true
why      = "absence from the slug table is what makes him unaddressable by scheduled work — bin/deliver.sh resolves a notify slug to a pubkey there, and every route config sets require_mention = true"
test     = "tests/test_fleet_guards.sh::aurelian-unaddressable"
