unit = "fleet-turn-check"
surface = "platform"
status = "standing"
suite    = []
suite_exempt = "script lives at ~/.config/buzz-team/fleet-turn-check.sh, not in this repo"
trigger = "hourly (+2min jitter)"
what = "proves an agent can COMPLETE a turn — the gate every other fleet signal missed for 4 days"
alerted = true
in_repo = true                   # backported from /etc 2026-09-02 (brief 2). The UNIT is
                                 # here now; the SCRIPT still is not — that is suite_exempt
                                 # above, and in_repo has never described the script.

