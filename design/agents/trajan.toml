# trajan — head of engineering. Normative capability manifest (D2).
# Descriptive of live state 2026-09-01. Ownership from design/workflow-registry.md §3 + §7.1.
#
# trajan owns every PLATFORM JOB: deterministic scripts with no persona in the loop.
# He is accountable for them being correct and alive, not for their output being good —
# there is no LLM output to judge. That is the whole distinction from the other three.

name    = "trajan"
role    = "Head of engineering — platform jobs, box reliability, vpc-seo queue"
pubkey  = "1212e9a7e5a2c41b4e56d266fe2b42bb1e528cfa58a482975b9e5ba4d389fab0"
