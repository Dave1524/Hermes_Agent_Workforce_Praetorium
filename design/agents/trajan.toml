# Capability prohibitions. enforced = true means a mechanism blocks it today;
# enforced = false means it is stated policy that nothing currently prevents.

[[must_not]]
rule     = "push the vault main branch"
enforced = true
why      = "the vault-main-push-guard pre-push hook is installed in BOTH vault clones on this box as of 2026-09-01 (canonical, and boxsafe which had none until today). Both clauses of the previous why were wrong: this box does hold a canonical push credential, and the boxsafe hook it named did not exist. What the hook enforces is that an unexplained main push cannot happen SILENTLY — it is friction and a record, not a boundary, since GitHub evaluates this box key as a ruleset bypass actor and --no-verify walks past the hook"
test     = "tests/test_fleet_guards.sh::vault-push-guard"

[[must_not]]
rule     = "run publish_boxsafe.sh"
enforced = false
why      = "publishing is Mac-side only"

[[must_not]]
rule     = "use --no-verify on any push"
enforced = false
why      = "it is the same push with the record removed"

[[must_not]]
rule     = "advance a vpc-seo item without Dave"
enforced = false
why      = "re-pointed 2026-09-02: the queue moved to Notion with the board's retirement, so the 60s-dispatch mechanism this rule named is gone. What remains is judgement — the SEO work is Dave's to sequence — and nothing prevents it, which is what enforced = false says"
