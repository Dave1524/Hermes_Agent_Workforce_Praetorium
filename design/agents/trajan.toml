suite    = ["tests/test_fleet_eval.sh"]
trigger = "daily 07:07 (+90s jitter)"
what = "delivery conformance + vault grounding regression"
alerted = false                  # DELIBERATE, not a gap — see notes
in_repo = true
notes = """
The only platform job that must NOT carry OnFailure=, and the reason is in its own unit
header: it exits 1 on a regression and `--deliver` has already posted the scorecard to
#ops, so the alert path would give one problem two notifications on two surfaces. Verified
rather than trusted before leaving it alone (D2): the 2026-09-01 p2 retrieval regression
was delivered at 05:09:04Z, discord ok, buzz ok, outcome delivered. Its non-zero exit is
the intended quiet second signal via `systemctl --failed`, and it clears on the next green
run. Do not "fix" this.
"""

