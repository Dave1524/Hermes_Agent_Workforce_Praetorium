[[workflows]]
unit = "praetorium-phaseb-brief@"
surface = "platform"
status = "campaign"
expires = "2026-09-02 05:22:00"
suite    = ["tests/test_phaseb_brief_jobs.sh"]
trigger = "five one-shot instances, all 2026-09-02: @2 00:12, @3 01:07, @4 02:07, @5 02:52, @6 05:22"
runner = "bin/run_phaseb_brief_cc.sh"
what = "writes one Phase-B implementation brief per queue id (design/phaseb-brief-queue.toml)"
alerted = true
in_repo = true
notes = """
ONE entry for the template family, not five: `praetorium-phaseb-brief@` is the join key to
systemd, and the five `@N.timer` files are instances of it. A registry keyed on the instance
names would grow a row per brief written.

`campaign`, not `standing` — every instance carries an absolute one-shot OnCalendar, and
`expires` is the latest of the five. By agent-model.md's status table it is `spent` the moment
that has passed, i.e. flag-for-removal, which is brief 6's job along with the units themselves.

It was missing from this registry entirely until brief 3, which is the omission that made its
coverage checker's unit-side assertion worth writing: five enabled timers ran against no
declared owner. `tests/test_phaseb_brief_jobs.sh` already existed and was unclaimed; this is
its owner.
"""

