# --- Platform jobs. `alerted` records whether OnFailure= is present ON THE LIVE UNIT,
# --- which is not the same question as whether the repo copy has it (agent-model.md §6.3).
[[workflows]]
unit = "fleet-turn-check"
surface = "platform"
status = "standing"
suite    = ["tests/test_fleet_turn_check.sh"]
trigger = "hourly (+2min jitter)"
what = "proves an agent can COMPLETE a turn — the gate every other fleet signal missed for 4 days"
alerted = true
in_repo = true                   # backported from /etc 2026-09-02 (brief 2). The UNIT came
                                 # here then; the SCRIPT arrived 2026-09-03 as
                                 # buzz-team/fleet-turn-check.sh. Both halves are now sourced.
notes = """
THE EXEMPTION IS GONE BECAUSE ITS PREMISE IS. It read `suite_exempt = "script lives at
~/.config/buzz-team/fleet-turn-check.sh, not in this repo"` until 2026-09-03, when brief 7
adopted that script into buzz-team/. Restating the exemption with a new reason was the other
option and it would have been dishonest: the code IS here and IS writable, which is exactly
the condition eval-spec.md 7.1 says suite_exempt does not cover. A true-looking exemption
whose premise the same commit removed is the worst of the three outcomes.

WHAT THE SUITE CAN AND CANNOT ASSERT, stated here so nobody mistakes it for a behavioural
test. It asserts the five design rules the script's own header names as required — enumerate
from systemd not a roster, bound each window at BOTH ends, print which bound produced it,
name a quiet unit out loud, exit non-zero on failure — each of which is the invariant whose
loss produced a past misdiagnosis. It does NOT run the script: gate 2 spends a real model
turn, and the script pins PATH at line 23, so a stubbed systemctl on PATH is defeated by
construction. That pin is a testability finding, not a defect to fix here — it exists so a
systemd unit with a minimal environment resolves its binaries.
"""

