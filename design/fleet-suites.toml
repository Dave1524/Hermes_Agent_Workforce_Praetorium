  "interaction-silence-is-decline",           # no send is a decline whose reason says the transcript cannot tell silence from a reply that never published
  "interaction-heartbeat-no-receipt",         # a heartbeat prompt is not a turn: nothing written, one log line, in both harnesses
  "interaction-skills-from-transcript",       # S1 skill telemetry: offered = the session's skill_listing in the praetorium namespace; invoked/read = THIS turn's Skill and SKILL.md Read tool uses, never an earlier turn's; measured-empty when the transcript lists nothing
  "codex-notify-skills-from-rollout",         # the codex side: offered = the developer <skills_instructions> listing, namespace-filtered; read = every SKILL.md a command in the turn names (through the $CODEX_HOME/skills/praetorium link or the vault); invoked is always empty — no Skill tool
  "interaction-usage-summed",                 # Claude usage is the sum over the turn's assistant messages, counted once per message id
  "interaction-send-is-a-command",            # the send must sit in command position; a grep or echo naming the string is not a send
  "interaction-never-blocks-stop",            # malformed stdin, missing transcript, no unit, unwritable root: exit 0, empty stdout, one log line
  "codex-notify-send-is-artifact",            # the codex notify payload plus the rollout under CODEX_HOME give the same receipt shape
  "codex-notify-silence-is-decline",          # a turn without a send is a decline, usage still measured from the rollout
  "codex-notify-harness-error-is-failed",     # a rollout whose task_complete carries an error is a failed turn with the error as its reason, never a decline
  "codex-notify-inbound-event-is-handoff",    # the <buzz-event> Event ID the turn answered is recorded as handoff.event, the dispatcher's run_id
  "codex-notify-usage-from-rollout",          # the turn's share of the thread total: last token_count in the span minus the last before it
  "codex-notify-missing-rollout-unavailable", # no rollout: a receipt with usage unavailable and the reason naming the missing rollout
  "codex-notify-never-fails",                 # malformed payload, wrong type, no CODEX_HOME, no unit: exit 0, empty stdout, one log line, no env value logged
  "receipt-reads-back-valid",                 # every receipt validates and control_room_api lists it as valid
  "interaction-relay-origin",                 # a <buzz-event> woke the turn: handoff names it, origin = relay
  "interaction-scheduled-origin",             # the session's own CronCreate / loop fire (isMeta, turnOrigin=scheduled) is its own turn: starts at the fire, no handoff, origin = scheduled, only its own usage
]
