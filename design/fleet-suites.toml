# Suites that belong to the fleet itself, not to a workflow.
#
# D6's join runs workflow -> suite: every entry in the workflow registry hand-declares the
# test files that own it (R15b), and brief 3's coverage checker reads that join in both
# directions. A suite reached by neither direction is an orphan, and the checker's first
# recommendation for an orphan is to delete it.
#
# tests/test_fleet_guards.sh has no workflow and never will: it asserts the guards on the
# agents themselves — a settings deny, a git hook, an absent slug, a namespace without a
# credential. Nothing schedules it, so nothing in the registry can claim it. This file is
# the second valid owner value that keeps the security suite out of the orphan bucket.
#
# owner = "fleet" is the declared value; design/eval-spec.md §6 documents it as part of
# D6's join so the checker and this file cannot drift apart.
#
# --- `asserts` IS JOINED, NOT DECORATIVE (W9, closed 2026-09-04) -----------------------
#
# Every id in an `asserts` list must be ANCHORED in the suite that entry names: the id,
# `::`-prefixed and wrapped in parentheses, on the line that opens the assertion group.
# tests/test_workflow_coverage.py's `asserts-anchored` reads the two sides against each
# other in BOTH directions — a declared id nothing anchors is red, and an anchor no entry
# declares is red. Renaming a rule is therefore an edit to two files, and forgetting the
# second one fails the gate instead of going quiet.
#
# It is worth knowing what this list WAS, because the shape looked more principled than it
# was. Measured 2026-09-04, before the anchors: 32 declared ids across the four entries, of
# which 8 were anchored, 5 more appeared as `check <id>` calls, and 19 appeared nowhere at
# all in the files they name. The two entries below with nine ids each matched them to
# prose group headers by eye — and one of those nine-id entries names a file that contains
# no assertions whatsoever, being an eight-line wrapper round a .py. The join follows that
# `exec python3` hop; a suite whose assertions live in a companion anchors them there.
#
# The notation is not new. design/agents/*.toml already writes `test = "<suite>::<id>"` and
# tests/test_fleet_guards.sh's `enforced-has-test` already greps the id back out of the
# named file, so this is the same namespace read from the other end. Parentheses are what
# distinguish a declaration site from a prose cross-reference, which is written bare.

[[suite]]
path    = "tests/test_fleet_guards.sh"
owner   = "fleet"
asserts = [
  "connector-deny",                  # marcus, claudius: outward connectors denied for agent sessions
  "augustus-no-claude-connectors",   # augustus: same rule, different mechanism — codex harness
  "deny-superset",                   # the strict file can never be laxer than ~/.claude/settings.json
  "vault-push-guard",                # trajan: the pre-push guard, in every vault clone on this box
  "aurelian-unaddressable",          # aurelian: absent from the slug table
  "propose-write-boundary",          # marcus, claudius: the _inbox/agents/** write boundary
  "augustus-no-fetch",               # augustus: no ssh credential inside his bwrap namespace
  "enforced-has-test",               # the reverse direction — an enforced flag with no assertion is red
]
why_no_workflow = """
It asserts fleet state, not the output of a scheduled job. Most of what it reads lives
outside this repo — ~/.claude/settings.json, .git/hooks in two vault clones, a bwrap
wrapper in /usr/local/bin, a --user unit — which is exactly why it exists: this repo's
commits cannot see those files move, so a test is the only thing that fails loudly when
the far side does.
"""

# The coverage checker itself. Same shape as the guard suite above and for the same reason:
# it is scheduled by nothing, so no registry entry can claim it, and without this block it
# reports ITSELF as an orphan on its first run.
[[suite]]
path    = "tests/test_workflow_coverage.sh"
owner   = "fleet"
asserts = [
  "parse-integrity",        # a coverage figure computed from zero parsed entries is refused
  "standing-has-suite",     # status = "standing" and no suite_exempt => len(suite) >= 1
  "suite-paths-exist",      # every declared suite path is a file on disk
  "exempt-named",           # every suite_exempt workflow is printed by name, never skipped
  "no-orphan-suite",        # both join directions: workflow -> suite, and this file's owners
  "timer-family-declared",  # every *.timer family in systemd/ has a manifest entry
  "asserts-anchored",       # W9: this list is joined to the assertions it names, both ways
  "asserts-join-counted",   # W9: and the join reports its own size, so a deleted rule is red
  "contract-exists",        # T1.1: every declared contract path is a file; ships red on ten
  "contract-join-counted",  # T1.1: the join reports entries checked, and that equals the manifest count
  "model-alias",            # T1.2/T2.1: runner --model equals the workflow's model
  "runner-tools",           # T1.2: --allowedTools equals surfaces.scheduled.tools (+ tools_web if web)
  "runner-mcp",             # T1.2: empty mcp means --strict-mcp-config and empty mcpServers
  "runner-join-counted",    # T1.2: the join reports entries checked, and that equals the manifest count
]
why_no_workflow = """
It grades the registry, not a job. Nothing execs it and nothing ever should — its subject is
design/agents/*.toml plus this file, both of which change only when a human edits them, so a
timer would run it against an unchanged input every night and prove nothing that bin/verify.sh
does not already prove on the commit that changes it.
"""

# The manifest -> list -> consumer join (W2/W3, brief 6). Same shape and same reason as the
# two above: nothing schedules it, so no registry entry can claim it, and its subject is the
# agreement BETWEEN artifacts rather than any one job's output. Claiming it from a workflow
# would be worse than leaving it here — tests/test_fleet_ownership.sh asserts one narrow
# property of bin/overnight_pre_snapshot.sh (that it sources the unit list), and hanging it
# off that workflow's `suite` would credit the coverage figure with a suite that does not
# cover the workflow. `standing-has-suite` is still red for that job, correctly.
#
# WORTH KNOWING WHILE READING THIS FILE: `no-orphan-suite` is narrower than its name. It
# reports an unclaimed suite only when that suite's subject is exec'd solely by an archived
# unit; an unclaimed suite with a live subject is not reported at all. So this entry is not
# what kept the gate green — nothing would have flagged its absence. Registering it is
# deliberate, not gate-driven. Widening the rule is out of brief 6's scope and is recorded
# as an open item in design/open-decisions.md.
[[suite]]
path    = "tests/test_fleet_ownership.sh"
owner   = "fleet"
asserts = [
  "list-schema",            # five columns, no duplicate units, scope in {system,user}, kind in {timer,service}, non-empty
  "list-equals-manifests",  # both join directions: no manifest unit missing, no unit invented
  "row-matches-manifest",   # scope/status/owner/kind agree with the declaring design/agents/*.toml
  "kind-matches-unit-files",# kind is joined against systemd/**, so a mistyped value is red rather than silent
  "profile-owner-header",   # every [[workflows]] profile exists and line 1 names its owner
  "no-prose-owner-drift",   # no profile's prose claims a persona other than its declared owner
  "consumers-name-the-list",# all six reporting consumers read config/fleet-units.tsv
  "deployable-not-design",  # bin/deploy ships config/ and does NOT ship design/
  "one-example-home",       # W4: templates live in profiles/, and no install command says otherwise
]
why_no_workflow = """
It grades an agreement between four artifacts — design/agents/*.toml, config/fleet-units.tsv,
profiles/*.md and the six consumers — none of which is a job's output. A timer would run it
nightly against inputs that change only when a human edits them, which is precisely when
bin/verify.sh already runs it.
"""

# --- A SECOND OWNER KIND, and the first entry here that is not fleet state --------------
#
# owner = "retired-tool". Read this before adding a third value, and before assuming the
# three entries above set the pattern: they assert live fleet state and always will. This
# one covers a ONE-SHOT that has already run.
#
# WHY IT IS NOT A DELETION, which is the orphan rule's own first recommendation.
# bin/content_inbox_finalize.py performed steps 4-5 of the 2026-08-14 Content DB migration
# — it froze the retired Agent Content Inbox and archived that database into Notion's
# trash. Its unit is in systemd/archive/, nothing execs it, and by every static measure it
# is dead code. It is not, for one reason: the pass is REVERSIBLE and has not been
# reversed. ~/agent-workforce/var/content_inbox_finalize.json exists, dated 2026-08-15
# 22:00, and has not been renamed to .undone — so `content_inbox_finalize.py undo` is still
# a live path against Dave's own board, restoring the database from trash, putting the
# original title and description back, and deleting the freeze callout.
#
# tests/test_content_inbox_finalize.sh is the only thing that verifies that path. Its
# "undo puts the board back" group asserts the restore, the title, the description, the
# callout deletion, and that the receipt is retired rather than left to be replayed.
# Deleting the suite as an orphan would leave an untested reversal tool aimed at live
# content — strictly worse than either keeping both or deleting both.
#
# WHEN TO DELETE. Not on a date — this entry deliberately names no expiry, because the
# window is not a clock this box can read: whether the trashed database is still
# restorable is Notion's retention behaviour, not something asserted here, and inventing a
# date would be a bounded window whose boundary is a guess. The trigger is a decision:
# once Dave confirms the 2026-08-14 migration will never be reversed, delete
# bin/content_inbox_finalize.py, both test files, systemd/archive/content-inbox-finalize.service
# and this block together. Deleting any subset re-opens the gap this entry closes.
[[suite]]
path    = "tests/test_content_inbox_finalize.sh"
owner   = "retired-tool"
asserts = [
  "check-writes-nothing",      # the preflight pass touches Notion not at all
  "apply-freeze-then-archive", # order is load-bearing: a note inside a trashed database is visible to nobody
  "receipt-reverses-both",     # the receipt carries the callout id and prior title `undo` needs
  "undo-restores-the-board",   # THE REASON THIS ENTRY EXISTS — restore, title, description, callout, receipt retired
  "any-guard-refuses",         # each of the six guards, alone, stops the pass with Notion untouched
  "partial-failure-reversible",# a failure between freeze and archive still writes a usable receipt
  "archive-must-stick",        # an archive that silently did not take is a failure, not a success
  "systemctl-parsed-by-key",   # KEY=VALUE, never positional — the same trap the pre-snapshot carries
  "notify-cannot-fail-the-run",# a broken delivery surfaces on stderr and does not fail the pass
]
why_no_workflow = """
It has no workflow because its subject already ran. systemd/archive/content-inbox-finalize.service
is the retirement record, and the orphan rule reads exactly that — subject exec'd only by an
archived unit — which is why this suite is the one the checker names. The registry cannot claim
it without inventing a `[[workflows]]` entry for a job that must never fire again, and a
status = "spent" entry would still have to name a unit that is deliberately not installed.
"""

# The contract schema validator (T1.4, docs/dev-plan-2026-09.md). Same shape and same reason
# as the coverage checker above: nothing schedules it, its subject is the agreement between
# design/contracts/*.md and the [[workflows]] entries that name them, and both change only
# when a human edits them. The rules are in tests/test_contract_schema.py; the ids below are
# anchored in the .sh, which asserts one per rule on the live tree after proving each on a
# fixture. Six of them are T4.0's check rules, added 2026-09-10: they grade the fenced
# ```check blocks under ## Acceptance checks, which were prose until that date.
[[suite]]
path    = "tests/test_contract_schema.sh"
owner   = "fleet"
asserts = [
  "manifest-parse",           # a manifest that does not parse is named, never dropped from the join
  "sections-present",         # the eight `## ` headings, each exactly once; fenced ones do not count
  "sections-ordered",         # in schema order; extra sections may sit between them
  "sections-nonempty",        # a required section says "none" rather than nothing
  "contract-declared",        # every contract file is named by some [[workflows]].contract
  "owner-matches-manifest",   # bold tokens in Identity's Owner(s) row == the declaring manifests, both ways
  "units-match-manifest",     # Identity's Unit(s) row, brace-expanded, == the declaring entries' units, both ways
  "one-contract-per-unit",    # no unit is named by entries pointing at two contract paths
  "named-for-unit",           # rule 1: stem is one of its units, or a declaring entry carries rule1_exempt
  "entry-shape",              # a [[workflows]] entry naming a contract also names a unit
  "contract-parseable",       # an unterminated code fence is named as the fence, not as missing sections
  "schema-sections",          # the eight section names are read from design/contract-schema.md, and are eight
  "exempt-named",             # every rule-1 exemption is printed by name, never skipped
  "validated-count",          # the count reported equals the files on disk, computed independently
  "checks-vocabulary",        # the executor's variables and the vantages are read from the schema doc
  "checks-executable",        # one ```check fence per numbered item, and every fence inside an item
  "checks-declared",          # the fence declares a unique id, and any `when` is a declared vantage
  "checks-decidable",         # the block is neither empty nor trivially true — `true` decides nothing
  "checks-syntax",            # bash -n accepts the block, so a fence that exists also runs
  "checks-env",               # every variable read is exported by the executor or set in the block
  "checks-graded",            # the check rules ran against real blocks and a real environment, not zero
  "outputs-actionability",    # ## Outputs names a beneficiary, a next actor and the benefit it claims
  "outputs-graded",           # the field list it graded against was read and non-empty, not zero
]
why_no_workflow = """
It grades the contracts against the manifests, not a job's output. The schema doc said "D3's
validator exists to keep the two ends equal" for a week before one existed; ten contracts land
in Phase 4 by as many sessions, and this is what makes each one fail by name instead of by
convention. A timer would run it nightly against inputs that change only on a commit.
"""

# The surface join (T6.2, W19 item 10). Same shape and same reason as the entries above:
# nothing schedules it, its subject is the agreement INSIDE each design/agents/*.toml —
# a `present = true` surface against the [[workflows]] entries naming it — and that changes
# only when a human edits a manifest, which is exactly when bin/verify.sh runs it.
[[suite]]
path    = "tests/test_manifest_surfaces.sh"
owner   = "fleet"
asserts = [
  "manifest-parse-named",        # a manifest that does not parse is named, never dropped from the join
  "manifest-shape-named",        # one that parses into a shape the checker cannot walk is named, not a traceback
  "present-surface-hosts-work",  # every surface declared present hosts >= 1 live [[workflows]] entry naming it
  "absent-surface-hosts-nothing",# and present = false hosts none — the same claim, read the other way
  "idle-status-not-hosting",     # spent and planned entries do not host a surface; dormant does
  "retired-surface-silent",      # present = false over zero entries is the retired shape, not a finding
]
why_no_workflow = """
It grades the manifests against themselves — a surface's `present` flag against the entries
that name the surface — which is no job's output. W19 found augustus.toml's scheduled surface
present over nothing for four days because the retirement commit touched only what a test
forced it to; this is that test.
"""

# The pointer-skill tree (T3.1, docs/dev-plan-2026-09.md). Same shape and same reason as the
# graders above: its subject is an agreement between four artifacts — skills/, its own README
# allocation table, design/agents/*.toml's scheduled runners, and the two scripts that deploy
# and drift-check the tree — none of which is a job's output.
#
# WHAT IT CAN AND CANNOT SEE, because the dev-plan gate says "a headless run lists the skills"
# and this suite deliberately does not. `claude plugin details` does not accept --plugin-dir
# (measured 2026-09-10: unknown option), so no deterministic CLI call enumerates a
# session-loaded plugin's skills, and the only listing that exists costs model tokens — which
# no suite in this repo spends. What is asserted instead is the chain: the tree is well-formed
# in the layout --plugin-dir actually reads, each runner names its owner's tree by explicit
# path in the DEPLOYED copy, the guard makes a missing tree fatal instead of silent, and drift
# keeps that copy equal to source. The live listing is a one-off recorded in the landing commit.
[[suite]]
path    = "tests/test_pointer_skills.sh"
owner   = "fleet"
asserts = [
  "pointer-not-copy",           # every SKILL.md is a few lines naming its canonical vault path
  "pointer-names-match",        # front-matter name == directory == the path segment in the body
  "plugin-manifest-valid",      # each owner tree is a plugin named praetorium-<owner>
  "skills-nested-under-skills", # no skill at a plugin root, which --plugin-dir silently ignores
  "allocation-matches-readme",  # the README table and the tree, both join directions
  "no-profile-duplicate",       # no pointer duplicates a task profile owning the same surface
  "runner-offers-owner-tree",   # every scheduled runner passes --plugin-dir at its own owner's tree
  "runner-skills-guard",        # and proves the plugin manifest readable first — the silent-path trap
  "runner-join-counted",        # the manifest join reports its size, so a parse matching nothing is red
  "drift-covers-skills",        # skills is in bin/deploy PATHS and in CONTENT_TREES, read from both
  "pointer-target-exists",      # box-gated: every named vault path resolves (existence only, never read)
]
why_no_workflow = """
Nothing schedules it and nothing should. Its inputs change only when a human edits them, which
is exactly when bin/verify.sh already runs it. The one thing a timer could add — proving a live
headless session sees the tree — is the thing no deterministic call can do, so a nightly run
would re-assert the static chain against an unchanged input and prove nothing new.
"""

# The Control Room read model/API is an operator surface over the portfolio, not a workflow
# systemd schedules. Its fixture suite owns the join across manifests, contracts, systemd
# state and receipts and therefore belongs to the fleet rather than to any one row it renders.
# When durable hosting lands, the service gets its own workflow entry and contract; these
# read-model rules remain fleet-wide.
[[suite]]
path    = "tests/test_control_room_api.sh"
owner   = "fleet"
asserts = [
  "control-room-api", # logical reconciliation, truthful unavailable states and read-only HTTP boundary
]
why_no_workflow = """
It tests the portfolio projection and HTTP trust boundary. Assigning it to one rendered
workflow would credit that workflow with a suite that primarily tests every other one.
"""
