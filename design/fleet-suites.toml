  "compare-regression-red",      # all four verdicts on fixtures: regression, improved, missing, unbaselined
  "compare-record-writes",       # --record is the only writer, and it stamps what it measured
  "compare-tolerance-quantised", # 1/runs absorbs one flaky run of three and not two
  "watched-paths-trigger",       # the change gate watches agent config, never .claude/briefs/
  "temp-root-outside-home",      # a TMPDIR under $HOME is refused, not warned about
  "ceiling-case-flips-the-verdict", # a `-must-not-fire` case that fired is OVERFIRED, never IMPROVED
  "every-pointer-has-eval",      # every pointer has a -fires case, every owner a ceiling case
  "baselined-case-can-go-red",   # a case the tolerance makes unfalsifiable is legal only while a notes says so
  "live-eval-clean",             # box, change-gated: the real tree still fires its skills
  "broken-skill-turns-red",      # the negative control — an unreachable skill tree IS red
]
why_no_workflow = """
Its subject is the agents' configuration — the pointer descriptions, the instruction layer,
