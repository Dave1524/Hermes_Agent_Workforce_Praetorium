  "idle-status-not-hosting",     # spent and planned entries do not host a surface; dormant does
  "retired-surface-silent",      # present = false over zero entries is the retired shape, not a finding
  "kanban-block-carries-no-profile-fact",  # no [surfaces.kanban] block carries governed_by, skills or board — the profiles it governed are deleted (T6.1)
