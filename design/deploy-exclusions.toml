# Files that exist in the DEPLOYED content trees and no longer exist in source.
#
# This is the content-tree twin of design/unit-ownership.toml, and the two answer different
# questions. unit-ownership.toml answers "is this unit ours, and may it ever be committed?"
# — a permanent property. This file answers "why is a file the source tree deleted still
# sitting in ~/agent-workforce?", which is a TEMPORARY state with a known end: someone runs
# `bin/deploy --prune`.
#
# WHY THE STATE EXISTS AT ALL. bin/deploy is additive by default. Deleting a file from this
# repo therefore does nothing to the tree systemd execs; the deployed copy survives until a
# --prune run removes it, and --prune is deliberately not automatic because it deletes from
# a live runtime. So every source deletion opens a window in which the runtime holds a file
# the repo has disowned, and until 2026-09-03 nothing measured that window: the drift check
# compared 2 of the 8 trees bin/deploy ships (W7).
#
# THE HAZARD IS NOT HYPOTHETICAL, and profiles/m1_signal_scan_task.md is the worked example.
# It was archived out of source on 2026-09-01 and still sits in the runtime. The live job
# does not read it — profiles/m1_signal_scan.env.example says so in as many words, and calls
# the block naming it "NOT A REVERT PATH" — but the reason it is not a revert path is that
# the file was archived, and the runtime is the one tree where it was not. A hand-edited env
# pointing at the old path finds a real, readable, stale profile.
#
# NO DATES, AND THAT IS DELIBERATE. The campaign exclusions in unit-ownership.toml's sibling
# mechanism carry an `expires` because a campaign has a scheduled end. A prune does not: it
# ends when Dave runs it. Inventing a review date here would be a bounded window whose
# boundary is a guess, and the check would then go red on a day chosen by nobody. The list
# self-clears instead — see the next paragraph, which is the whole design.
#
# THE LIST IS EXACT, AND IT IS CHECKED IN BOTH DIRECTIONS. A runtime-only file that is NOT
# named here is drift and fails. An entry here naming a file that is NO LONGER in the runtime
# also fails, telling you to delete the entry. So the moment `bin/deploy --prune` runs, this
# file becomes one finding per entry saying "the prune happened, remove these" — which is how a
# stale exclusion list is prevented from quietly becoming permanent. An exclusion that
# outlives its subject is the same defect as no exclusion at all, pointing the other way.

# Pruned 2026-09-17 (T6.3): every entry cleared by one `bin/deploy --prune`; the list is empty
# until the next source deletion opens a window.

[[runtime_only]]
path  = "ttm-pool-drain.timer"
